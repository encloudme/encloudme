<svg width="380" height="215" viewBox="0 0 380 215" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #0969da; }
    .sub-title { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #24292f; }
    .stat-label { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #57606a; }
    .stat-val { font: 700 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #0969da; }
    .footer-text { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #57606a; }
  </style>

  <rect width="379" height="214" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="25" y="35" class="header">📅 Commit Habits &amp; Activity Schedule</text>
  <text x="25" y="58" class="sub-title">Productive Hours</text>

  
  <text x="25" y="80" class="stat-label">Morning (06-12)</text>
  <text x="135" y="80" class="stat-val">30 (25%)</text>
  <rect x="190" y="73" width="160" height="6" rx="3" fill="#eaeef2"/>
  <rect x="190" y="73" width="40.3" height="6" rx="3" fill="#0969da"/>

  <text x="25" y="100" class="stat-label">Afternoon (12-18)</text>
  <text x="135" y="100" class="stat-val">21 (18%)</text>
  <rect x="190" y="93" width="160" height="6" rx="3" fill="#eaeef2"/>
  <rect x="190" y="93" width="28.2" height="6" rx="3" fill="#0969da"/>

  <text x="25" y="120" class="stat-label">Evening (18-24)</text>
  <text x="135" y="120" class="stat-val">40 (34%)</text>
  <rect x="190" y="113" width="160" height="6" rx="3" fill="#eaeef2"/>
  <rect x="190" y="113" width="53.8" height="6" rx="3" fill="#0969da"/>

  <text x="25" y="140" class="stat-label">Night (00-06)</text>
  <text x="135" y="140" class="stat-val">28 (24%)</text>
  <rect x="190" y="133" width="160" height="6" rx="3" fill="#eaeef2"/>
  <rect x="190" y="133" width="37.6" height="6" rx="3" fill="#0969da"/>


  <line x1="25" y1="158" x2="355" y2="158" stroke="#d0d7de" stroke-width="1"/>

  <g transform="translate(25, 180)">
    <text x="0" y="0" class="footer-text">Weekdays (Mon-Fri): <tspan class="stat-val">55 (46%)</tspan></text>
    <text x="180" y="0" class="footer-text">Weekends (Sat-Sun): <tspan class="stat-val">64 (54%)</tspan></text>
  </g>
</svg>
