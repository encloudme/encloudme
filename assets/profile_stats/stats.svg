  </g>

  <line x1="25" y1="128" x2="355" y2="128" stroke="#d0d7de" stroke-width="1"/>

  <rect x="25.0" y="145" width="303.7" height="8" rx="4" fill="#3572A5"/><rect x="330.7" y="145" width="13.7" height="8" rx="4" fill="#083fa1"/><rect x="346.4" y="145" width="7.0" height="8" rx="4" fill="#89e051"/><rect x="355.4" y="145" width="5.6" height="8" rx="4" fill="#292929"/>
  
        <circle cx="25" cy="172" r="4" fill="#3572A5" />
        <text x="35" y="176" class="stat-text">Python 92%</text>
        
        <circle cx="175" cy="172" r="4" fill="#083fa1" />
