<svg width="380" height="215" viewBox="0 0 380 215" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #0969da; }
    .stat-label { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #24292f; }
    .stat-val { font: 700 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #0969da; }
    .stat-text { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #57606a; }
  </style>

  <rect width="379" height="214" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="25" y="35" class="header">⚡ Local Combined Git Stats</text>

  <g transform="translate(25, 60)">
    <text x="0" y="0" class="stat-label">Total Commits (All Repos):</text>
    <text x="230" y="0" class="stat-val">104</text>

    <text x="0" y="24" class="stat-label">Tracked Repositories:</text>
    <text x="230" y="24" class="stat-val">5</text>

    <text x="0" y="48" class="stat-label">Latest Activity Date:</text>
    <text x="230" y="48" class="stat-val">Oct 02, 2026</text>
  </g>

  <line x1="25" y1="128" x2="355" y2="128" stroke="#d0d7de" stroke-width="1"/>

  <rect x="25.0" y="152" width="314.0" height="8" rx="4" fill="#3572A5"/>
  <rect x="341.0" y="152" width="9.4" height="8" rx="4" fill="#083fa1"/>
  <rect x="352.4" y="152" width="4.3" height="8" rx="4" fill="#292929"/>
  <rect x="358.7" y="152" width="2.3" height="8" rx="4" fill="#89e051"/>
  
  <circle cx="25" cy="178" r="4" fill="#3572A5" />
  <text x="35" y="182" class="stat-text">Python 95%</text>
  <circle cx="185" cy="178" r="4" fill="#083fa1" />
  <text x="195" y="182" class="stat-text">Markdown 3%</text>
  <circle cx="25" cy="196" r="4" fill="#292929" />
  <text x="35" y="200" class="stat-text">JSON 1%</text>
  <circle cx="185" cy="196" r="4" fill="#89e051" />
  <text x="195" y="200" class="stat-text">Shell 1%</text>
  
</svg>
